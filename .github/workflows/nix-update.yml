name: "Update Packages"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *" # 10 am every day
permissions:
  contents: write
  pull-requests: write
jobs:
  updateFlakePackages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.5
        with:
          nix_path: "nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz"
      - name: Update flake packages
        uses: gepbird/nix-update-action@908e5859db8a991f00de23b423e564a561f3987d
        with:
          blacklist: "twintaillauncher"
