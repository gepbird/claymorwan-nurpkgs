name: "Update Packages"
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 10 * * *" # 10 am every day
permissions:
  contents: write
  pull-requests: write
jobs:
  updateFlakePackages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.7
        with:
          nix_path: "nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz"
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 runners restrict them via AppArmor, which breaks bwrap
        # used by some update scripts (e.g. gradle's fetch-deps)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
      - name: Update flake packages
        uses: gepbird/nix-update-action@v3.1.1
        with:
          packages: "utmt-cli,shimelinux"
